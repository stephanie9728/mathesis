meta:
  task_id: missing_apple_blindspot_plate
  task_name: Pick Apple – Apple Outside Initial View
  error_type: observable
  action: retrieve
  object: apple

detector:
  type: missing_object
  target_from_meta: object
  min_total_nodes: 1
  confirm_k: 1

  gate_presence_any:
    - plate
    - banana
    - table

  present_count_ge: 1

controller:
  window:
    warmup: 30
    stride: 90
    size: 90

tools:
  correct: apple

llm:
  model: gpt-4o-mini

  goal_en: >
    Help the user retrieve an apple from the table and present it.

  scene_description: >
    A table with a plate holding a banana.
    An apple is also on the table, but it is outside the robot’s initial field of view.

  task_context: >
    The robot first inspects the plate and does not see the apple.
    The apple is not visible from the current viewpoint.
    The robot should adjust its viewpoint to locate the apple,
    then grasp and present it.
